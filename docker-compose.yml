version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: smartdiagnosis_postgres
    restart: always
    env_file:
      - backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smartdiagnosis_net
    secret_key:
        - postgres_password

volumes:
  postgres_data:


networks:
  smartdiagnosis_net:
    driver: bridge
